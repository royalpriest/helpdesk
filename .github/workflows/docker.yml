name: Docker image

# Builds the image on every pull request, and publishes it to GitHub Container
# Registry (ghcr.io) for each release.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Gemfile.lock
      - .github/workflows/docker.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: helpdesk:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image boots and serves pages
        run: |
          docker run -d --name helpdesk -p 3000:3000 \
            -e SECRET_KEY_BASE=$(openssl rand -hex 64) \
            -e FORCE_SSL=false -e ASSUME_SSL=false \
            helpdesk:test
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/up > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/up
          curl -fsS http://localhost:3000/session/new | grep -q "Sign in"

      - name: Show container logs
        if: failure()
        run: docker logs helpdesk

      - name: Push to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
